server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    # Reverse-proxy API and uploaded-image requests to the backend container
    # so the frontend can keep using relative "/api" and "/uploads" paths —
    # exactly like the Vite dev-server proxy does, just at the nginx layer.
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
    }

    # React Router (client-side routing) — fall back to index.html for any
    # path that isn't a real static file, so /shop, /admin/orders/123 etc.
    # don't 404 on a hard refresh.
    location / {
        try_files $uri /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
